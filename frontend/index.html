<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header id="app-header" class="app-header hidden">
    <div class="header-inner">
      <div class="brand">
        <img id="brand-logo" class="brand-logo" alt="" hidden>
        <span id="brand-name" class="brand-name">Mission Home</span>
      </div>
      <div class="header-user">
        <span id="user-email" class="user-email"></span>
        <span id="user-role" class="user-role"></span>
        <button id="sign-out-btn" class="link-btn">Sign out</button>
      </div>
    </div>
  </header>

  <main id="app-main" class="app-main"></main>

  <script src="/static/app.js"></script>
</body>
</html>
